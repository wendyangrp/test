<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Persona Interview · Empathy Toolkit</title>
    <meta name="description" content="Interview an AI persona to practise empathy interviews." />
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/theme.js" defer></script>
    <script src="/tools/persona-interview/persona-interview.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="site-title" href="/">Empathy Toolkit</a>
        <button id="theme-toggle" type="button">🌙 Dark theme</button>
      </div>
    </header>

    <main class="container">
      <p><a href="/">← All tools</a></p>
      <h1>Persona Interview</h1>

      <!-- Step 1: set up the persona -->
      <section id="setup-step" class="panel">
        <h2>1. Set up your persona</h2>
        <p class="intro">
          Describe the person you want to interview. The more detail you give,
          the more realistic their answers will be.
        </p>
        <form id="persona-form">
          <div class="form-grid">
            <div class="field">
              <label for="p-name">Name</label>
              <input id="p-name" name="name" required maxlength="80" />
            </div>
            <div class="field">
              <label for="p-age">Age</label>
              <input id="p-age" name="age" inputmode="numeric" maxlength="20" />
            </div>
            <div class="field wide">
              <label for="p-occupation">Occupation</label>
              <input id="p-occupation" name="occupation" maxlength="120" />
            </div>
            <div class="field wide">
              <label for="p-background">Background <span class="hint">(life situation, context)</span></label>
              <textarea id="p-background" name="background" maxlength="1000"></textarea>
            </div>
            <div class="field">
              <label for="p-goals">Goals <span class="hint">(what they want)</span></label>
              <textarea id="p-goals" name="goals" maxlength="1000" rows="4"></textarea>
            </div>
            <div class="field">
              <label for="p-frustrations">Frustrations <span class="hint">(what gets in the way)</span></label>
              <textarea id="p-frustrations" name="frustrations" maxlength="1000" rows="4"></textarea>
            </div>
            <div class="field wide">
              <label for="p-personality">Personality and way of talking <span class="hint">(optional)</span></label>
              <textarea id="p-personality" name="personality" maxlength="600"></textarea>
            </div>
          </div>
          <div class="actions">
            <button type="submit" class="primary">Start interview</button>
            <button type="button" id="fill-example">Fill example</button>
          </div>
        </form>
      </section>

      <!-- Step 2: interview -->
      <section id="chat-step" class="panel" hidden>
        <div class="persona-summary">
          <h2 id="persona-title"></h2>
          <p id="persona-subtitle"></p>
        </div>

        <p id="error" class="error" role="alert" hidden></p>

        <ol id="chat-log" class="chat-log" aria-live="polite">
          <li class="chat-empty">Ask your first question. Try open questions like “Tell me about the last time…”.</li>
        </ol>

        <form id="chat-form" class="chat-form">
          <textarea id="question" aria-label="Your question" placeholder="Type a question…" maxlength="1000" rows="2" required></textarea>
          <button type="submit" class="primary" id="send-btn">Ask</button>
        </form>
        <p id="status" class="status"></p>

        <div class="actions">
          <button type="button" id="copy-transcript">Copy transcript</button>
          <button type="button" id="edit-persona">Edit persona</button>
          <button type="button" id="new-interview">New interview</button>
        </div>
      </section>
    </main>
  </body>
</html>
